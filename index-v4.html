<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fleet Command — Joseph's AI Fleet</title>
<link rel="icon" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<style>
/* ══════════ Fleet Command v4 — full-viewport canvas bridge ══════════ */
:root{
  --bg:#04060d; --cyan:#5ff2ff; --green:#51ff9e; --amber:#ffbf47; --red:#ff5470;
  --muted:#8b9bb8; --text:#e6f0ff; --panel:rgba(8,15,28,.92); --line:rgba(95,242,255,.25);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
/* slim HUD — status chrome only, no cards */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
  pointer-events:none;z-index:5}
#hud .brand{font-size:13px;letter-spacing:4px;color:var(--cyan);font-weight:700;
  text-shadow:0 0 10px rgba(95,242,255,.55);white-space:nowrap}
#hud .sub{font-size:10px;color:var(--muted);letter-spacing:1px;white-space:nowrap}
#hud .sp{flex:1}
#hud .sync{font-size:10px;color:var(--muted);letter-spacing:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hud .sync.err{color:var(--red)}
.hbtn{pointer-events:auto;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;
  background:rgba(95,242,255,.07);color:var(--text);font-size:11px;letter-spacing:2px;font-weight:600;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hbtn:active{background:rgba(95,242,255,.2)}
.hbtn.on{border-color:var(--green);color:var(--green)}
/* detail card — appears on tap, dismissed on tap-away */
#card{position:fixed;z-index:10;max-width:min(320px,86vw);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none;
  box-shadow:0 8px 30px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#card.show{display:block}
#card .k{font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:2px}
#card .t{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
#card .row{font-size:12px;color:var(--text);line-height:1.5;word-break:break-word}
#card .row b{color:var(--cyan);font-weight:600}
#card .task{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45;word-break:break-word}
#card .x{position:absolute;top:6px;right:10px;color:var(--muted);font-size:16px;cursor:pointer;padding:4px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <div><div class="brand">FLEET COMMAND</div><div class="sub" id="hud-sub">BRIDGE // LIVE</div></div>
  <div class="sp"></div>
  <div class="sync" id="hud-sync">connecting…</div>
  <button class="hbtn" id="abtn" title="toggle ambience">🔇 SOUND</button>
</div>
<div id="card"><span class="x" id="card-x">×</span><div class="k" id="card-k"></div><div class="t" id="card-t"></div><div id="card-b"></div></div>
<script>
'use strict';
/* ═══════════════ v4 — "little guys walking around a spaceship" ═══════════════
   One full-viewport canvas. Zero dependencies. Everything renders from
   data/registry.json + data/fleet-<ai>.json. No hardcoded crew, ever. */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(s){s=String(s||'?');let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function shade(hex,amt){const n=parseInt(String(hex).slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255,p=Math.abs(amt);r=Math.round(lerp(r,t,p));g=Math.round(lerp(g,t,p));b=Math.round(lerp(b,t,p));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function fmtElapsed(s){s=Math.max(0,Math.floor(s||0));if(s<60)return s+'s';const m=Math.floor(s/60);
  if(m<60)return m+'m';return Math.floor(m/60)+'h '+(m%60)+'m';}
function ago(iso){const d=Date.now()-Date.parse(iso);return isNaN(d)?'?':fmtElapsed(d/1000)+' ago';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* fit a label into maxW px under the current ctx font — word-boundary
   ellipsis, hard-cut fallback for single long words */
function fitLabel(text,maxW){
  text=String(text);
  if(ctx.measureText(text).width<=maxW)return text;
  const words=text.split(/\s+/);let out='';
  for(const wd of words){
    const cand=out?out+' '+wd:wd;
    if(ctx.measureText(cand+'…').width>maxW)break;
    out=cand;
  }
  if(!out){out=text;while(out.length>1&&ctx.measureText(out+'…').width>maxW)out=out.slice(0,-1);}
  return out+'…';
}

/* ── logical scene size ── */
const LW=1280, LH=720;
const STALE_MS=45*60*1000, POLL_MS=60*1000;

/* ── state ── */
const S={feeds:[],t:0,redAlert:false,tickerText:'',tickerX:1264,walkers:[],hits:[],
  bays:[],bots:[],pods:[],syncAt:null,syncErr:null,bayEnter:{},alertPulse:0};

/* ── data: registry + feeds, re-polled every 60s ── */
async function fetchJSON(url){const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function loadFeed(meta){
  try{
    let url=null;
    if(meta.file)url='data/'+meta.file;
    else if(meta.url)url=meta.url;
    else if(meta.fileId)url='https://drive.google.com/uc?export=download&id='+meta.fileId;
    if(!url)throw new Error('no source');
    const feed=await fetchJSON(url+(url.indexOf('?')>=0?'&':'?')+'t='+Date.now());
    if(!feed||typeof feed!=='object')throw new Error('bad feed');
    return {meta:meta,feed:feed,ok:true};
  }catch(e){return {meta:meta,feed:null,ok:false,err:String((e&&e.message)||e)};}
}
async function sync(){
  try{
    const reg=await fetchJSON('data/registry.json?t='+Date.now());
    const metas=(reg&&Array.isArray(reg.feeds))?reg.feeds:[];
    const res=await Promise.all(metas.map(loadFeed));
    S.feeds=res;S.syncAt=new Date();S.syncErr=null;
  }catch(e){S.syncErr=String((e&&e.message)||e);}
  reconcile();buildTicker();updateHud();
}
function feedAgeMs(e){if(!e||!e.ok||!e.feed||!e.feed.updated_at)return Infinity;
  const t=Date.parse(e.feed.updated_at);return isNaN(t)?Infinity:Date.now()-t;}
function isStale(e){return !e.ok||feedAgeMs(e)>STALE_MS;}
function aiColor(ai,idx){const C={sebastian:'#5ff2ff',claude:'#ff9f43',grok:'#c084fc',
  gemini:'#2dd4bf',chatgpt:'#a3e635'};if(C[ai])return C[ai];
  const E=['#ff6b9d','#ffd166','#8aff80','#7ddcff','#ff9e7d','#b8a7ff'];
  return E[(hash(ai)+(idx||0))%E.length];}
function updateHud(){
  const el=$('hud-sync');
  if(S.syncErr){el.textContent='sync error';el.className='sync err';}
  else if(S.syncAt){const n=S.feeds.filter(e=>e.ok&&!isStale(e)).length;
    el.textContent='sync '+S.syncAt.toLocaleTimeString()+' · '+n+'/'+S.feeds.length+' live';el.className='sync';}
  const sub=$('hud-sub');
  sub.textContent=S.redAlert?'BRIDGE // RED ALERT':'BRIDGE // LIVE';
}

/* ── ambient audio (Web Audio, OFF by default) ── */
let AC=null,audioOn=false,audioNodes=null;
function setAudio(on){
  audioOn=on;$('abtn').textContent=on?'🔊 SOUND':'🔇 SOUND';$('abtn').classList.toggle('on',on);
  if(on){
    if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}
    if(AC.state==='suspended')AC.resume();
    if(audioNodes)return;
    const g=AC.createGain();g.gain.value=0.5;g.connect(AC.destination);
    // engine hum
    const hum=AC.createOscillator();hum.type='sine';hum.frequency.value=48;
    const hg=AC.createGain();hg.gain.value=0.05;hum.connect(hg);hg.connect(g);hum.start();
    const hum2=AC.createOscillator();hum2.type='triangle';hum2.frequency.value=96.5;
    const hg2=AC.createGain();hg2.gain.value=0.015;hum2.connect(hg2);hg2.connect(g);hum2.start();
    // chiptune blips — soft pentatonic wander
    const scale=[220,261.63,293.66,329.63,392,440,523.25];
    let step=0;
    const timer=setInterval(()=>{
      if(!audioOn)return;
      const o=AC.createOscillator();o.type='square';o.frequency.value=scale[step%scale.length];
      const og=AC.createGain();og.gain.setValueAtTime(0.018,AC.currentTime);
      og.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.28);
      o.connect(og);og.connect(g);o.start();o.stop(AC.currentTime+0.3);
      step+= [1,2,1,3,1,2,4][Math.floor(Math.random()*7)];
    },420);
    audioNodes={g:g,timer:timer};
  }else if(audioNodes){clearInterval(audioNodes.timer);audioNodes=null;
    if(AC)AC.suspend();}
}
$('abtn').addEventListener('click',()=>setAudio(!audioOn));

/* ═══════════════ pixel crew sprites (canvas-drawn, no downloads) ═══════════════ */
const SKIN='#f0c8a0', DARKC='#141d33', VISOR='#0b1626';
/* crew: 12x14 grid, u=2 -> 24x28px. origin x,y = center-bottom (feet). */
function drawCrew(c,x,y,o){
  o=o||{};const color=o.color||'#5ff2ff',pose=o.pose||'stand',f=o.f||0,t=o.t||0;
  const dim=!!o.dim,u=2;
  const suit=dim?'#232c44':color, suitD=dim?'#1a2135':shade(color,-0.35),
        skin=dim?'#6b5f52':SKIN, dark=dim?'#101625':DARKC;
  c.save();c.translate(Math.round(x),Math.round(y));
  const R=(gx,gy,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round((gx-6)*u),Math.round((gy-14)*u),Math.round(w*u),Math.round(h*u));};
  const bob=(pose==='walk')?(f%2?-2:0):(pose==='work'?Math.round(Math.sin(t*7)*1.2):Math.round(Math.sin(t*2)*1.5));
  c.translate(0,bob);
  if(pose==='sit'||pose==='rest'){
    // seated: torso + folded legs
    R(4,6,4,5,suit); R(5,7,2,1,dim?'#1a2135':shade(color,0.35));
    R(2,10,8,2,dark); R(2,10,2,3,dark);           // folded legs
    R(4,1,4,3,skin); R(4,2,4,1,VISOR); R(4,2,1,1,dim?'#333':color); // head+visor
    R(3,6,1,4,suitD); R(8,6,1,4,suitD);            // arms resting
    if(pose==='rest'&&Math.floor(t*0.5)%4===0){c.fillStyle=dim?'#3a4358':'#9fd8ff';
      c.font='9px "Courier New",monospace';c.fillText('z',10*u-12,-2*u);}
  }else{
    R(4,1,4,3,skin);                              // head
    R(4,2,4,1,VISOR);                             // visor
    R(4,2,1,1,dim?'#2a3247':color);                // visor glow
    R(5,0,1,1,suit);                              // antenna
    R(4,4,4,5,suit);                              // torso
    R(5,5,2,1,dim?'#232c44':shade(color,0.4));     // chest light
    if(pose==='work'){
      // arms forward to console (up), hands typing
      const ty=f%2?2.4:3;
      R(3,4,1,3,suitD);R(8,4,1,3,suitD);
      R(3,ty,2,1,skin);R(7,ty,2,1,skin);
    }else{
      R(3,4,1,4,suitD);R(8,4,1,4,suitD);           // arms
      R(3,8,1,1,skin);R(8,8,1,1,skin);             // hands
    }
    if(pose==='walk'){
      // alternating legs
      if(f===0){R(4,9,2,4,dark);R(6,10,2,4,dark);}
      else if(f===2){R(4,10,2,4,dark);R(6,9,2,4,dark);}
      else{R(4,9,2,5,dark);R(6,9,2,5,dark);}
      c.translate(f===1?1:f===3?-1:0,0);
    }else{
      R(4,9,2,5,dark);R(6,9,2,5,dark);             // legs
    }
  }
  c.restore();
}
/* service bot (scheduled job): 30x26 */
function drawBot(c,x,y,o){
  o=o||{};const t=o.t||0;
  const st=o.status||'never';
  const glow=st==='ok'?'#51ff9e':st==='error'?'#ff5470':'#4a5872';
  c.save();c.translate(Math.round(x),Math.round(y));
  c.fillStyle='#1a2440';c.fillRect(-15,-26,30,26);
  c.fillStyle='#242f52';c.fillRect(-15,-26,30,6);
  c.fillStyle=o.color||'#5ff2ff';c.fillRect(-11,-22,22,3);
  // status light
  const fl=st==='error'?(Math.floor(t*6)%2===0):false;
  c.fillStyle=fl?'#3a2030':glow;
  c.beginPath();c.arc(0,-14,4,0,7);c.fill();
  if(st==='ok'||fl&&st==='error'){c.fillStyle=glow;c.globalAlpha=0.25;
    c.beginPath();c.arc(0,-14,9,0,7);c.fill();c.globalAlpha=1;}
  // treads
  c.fillStyle='#0d1428';c.fillRect(-15,-6,30,6);
  c.fillStyle='#2a3558';for(let i=-12;i<12;i+=6)c.fillRect(i,-5,3,4);
  c.restore();
}
/* console station */
function drawConsole(c,x,baseY,w,color,dark,big){
  const h=big?58:40;
  c.save();c.translate(Math.round(x),Math.round(baseY));
  c.fillStyle=dark?'#0a0e1a':'#16223c';
  c.fillRect(-w/2,-h,w,h);
  c.fillStyle=dark?'#070b14':'#1f2c4e';
  c.fillRect(-w/2,-h,w,6);
  const sw=w-14,sh=big?26:16;
  c.fillStyle=dark?'#05070d':'#04121e';
  c.fillRect(-sw/2,-h+10,sw,sh);
  if(!dark){
    c.fillStyle=color;c.globalAlpha=0.28;c.fillRect(-sw/2,-h+10,sw,sh);c.globalAlpha=1;
    c.strokeStyle=color;c.globalAlpha=0.8;c.lineWidth=1;
    c.beginPath();
    for(let i=0;i<=sw;i+=4){const yy=-h+10+sh/2+Math.sin(i*0.3+S.t*3)*sh*0.22;
      i===0?c.moveTo(-sw/2+i,yy):c.lineTo(-sw/2+i,yy);}
    c.stroke();c.globalAlpha=1;
  }else if(Math.floor(S.t*1.6)%2===0){
    c.fillStyle='#ff5470';c.font='bold 9px "Courier New",monospace';c.textAlign='center';
    c.fillText('NO SIGNAL',0,-h+10+sh/2+3);
  }
  c.restore();
}

/* ═══════════════ scene state: bays, walkers, bots, pods ═══════════════ */
function stationFor(b,specId){
  if(!b||!b.stations||!b.stations.length)return null;
  return b.stations.find(s=>s.spec&&s.spec.id===specId)||b.stations[0];
}
function reconcile(){
  /* bays — one per registry entry, registry order */
  const bays=[];let idx=0;
  for(const e of S.feeds){
    const ai=(e.feed&&e.feed.ai)||e.meta.ai||('ai'+idx);
    const label=(e.feed&&e.feed.label)||e.meta.label||ai;
    const color=aiColor(ai,idx);
    const specs=(e.ok&&e.feed&&Array.isArray(e.feed.specialists))?e.feed.specialists:[];
    const dark=isStale(e);
    if(!(ai in S.bayEnter))S.bayEnter[ai]=0;
    bays.push({ai:ai,label:label,color:color,specs:specs,dark:dark,feed:e,
      w:0,x:0,stations:[]});
    idx++;
  }
  /* widths. sebastian's bay goes in the middle slot so the command
     console lands near deck-center; row is centered in x 16..1000. */
  const PAD=16;let sp=64;const MINSP=46;
  const widths=bays.map(b=>b.specs.length?(b.specs.length*sp+PAD*2):150);
  const avail=984; // x 16..1000, lounge beyond
  let total=widths.reduce((a,b)=>a+b,0);
  if(total>avail&&total>0)sp=Math.max(MINSP,sp*avail/total);
  const ws=bays.map(b=>b.specs.length?(b.specs.length*sp+PAD*2):150);
  total=ws.reduce((a,b)=>a+b,0);
  const sebI=bays.findIndex(b=>b.ai==='sebastian');
  let order=bays;
  if(sebI>=0){
    const others=bays.filter((_,i)=>i!==sebI);
    const mid=Math.floor(others.length/2);
    order=others.slice(0,mid).concat([bays[sebI]],others.slice(mid));
  }
  let x=16+Math.max(0,(avail-total)/2);
  for(const b of order){
    b.w=ws[bays.indexOf(b)];b.x=x;x+=b.w;
    b.specs.forEach((spc,j)=>{
      const sx=b.x+PAD+(b.specs.length?(j*sp+sp/2):b.w/2);
      b.stations.push({spec:spc,x:sx,command:(spc.specialty==='command'&&b.ai==='sebastian')});
    });
  }
  S.bays=bays;
  reconcileWalkers();reconcileBots();reconcilePods();
}
function reconcileWalkers(){
  const seen=new Set();
  for(const b of S.bays){
    if(b.dark||!b.feed.feed)continue;
    const live=b.feed.feed.live||[];
    for(const a of live){
      if(!a||!a.id||a.id==='main-chat')continue; // captain is persistent
      const key=b.ai+'|'+a.id;seen.add(key);
      let w=S.walkers.find(w=>w.key===key);
      const st=stationFor(b,a.specialist);
      if(!w){
        S.walkers.push({key:key,ai:b.ai,color:b.color,agent:a,
          x:Math.random()<0.5?-30:LW+30,y:536,state:'enter',
          tx:st?st.x:640,ty:536,speed:80+Math.random()*50,phase:Math.random()*6,
          station:st,frame:0,ft:0});
      }else{w.agent=a;w.station=st;if(w.state==='leave'){w.state='enter';w.tx=st?st.x:640;w.ty=536;}}
    }
  }
  for(const w of S.walkers){
    if(!seen.has(w.key)&&w.state!=='leave'&&w.state!=='gone'){
      w.state='leave';w.tx=w.x<LW/2?-40:LW+40;w.ty=536;
    }
  }
}
function reconcileBots(){
  const bots=[];let i=0;
  for(const b of S.bays){
    if(!b.feed.feed)continue;
    for(const j of (b.feed.feed.scheduled||[])){
      if(!j)continue;
      bots.push({job:j,ai:b.ai,color:b.color,dark:b.dark,
        status:b.dark?'never':(j.last_status||'never'),x:0,y:0});
      i++;
    }
  }
  // dock strip: x 16..1264, y 612..700 — wrapped rows
  const maxW=1264-16, bw=64,bh=58;let bx=16,by=636,row=0;
  const vis=[];
  for(const bt of bots){
    if(bx+bw>16+maxW){bx=16;row++;by+=bh;}
    if(row>1){break;} // two rows max, rest counted
    bt.x=bx+bw/2;bt.y=by;bx+=bw;vis.push(bt);
  }
  S.bots=vis;S.botOverflow=bots.length-vis.length;
}
function reconcilePods(){
  const pods=[];let i=0;
  for(const b of S.bays){
    if(!b.feed.feed)continue;
    for(const ch of (b.feed.feed.chats||[])){
      if(!ch)continue;
      const y=226+i*96;
      if(y>560)break;
      pods.push({chat:ch,ai:b.ai,color:b.dark?'#3a4358':b.color,
        x:1136,y:y,dark:b.dark});
      i++;
    }
  }
  S.pods=pods;
}
/* ticker from real recent[] + failed jobs */
function buildTicker(){
  const items=[];
  for(const e of S.feeds){
    if(!e.ok||!e.feed)continue;
    const label=e.feed.label||e.meta.label||e.meta.ai||'?';
    for(const r of (e.feed.recent||[]).slice(0,15)){
      if(!r||!r.completed_at)continue;
      const t=Date.parse(r.completed_at);if(isNaN(t))continue;
      items.push({t:t,alert:r.status!=='done',
        txt:(r.status==='done'?'✓ ':r.status==='failed'?'✗ ':'■ ')+(r.name||'task')+' — '+label});
    }
    for(const j of (e.feed.scheduled||[])){
      if(j&&j.last_status==='error'){
        const t=Date.parse(j.last_run)||0;
        items.push({t:t,alert:true,txt:'⚠ JOB FAILED: '+(j.name||j.id)+' — '+label});
      }
    }
  }
  items.sort((a,b)=>b.t-a.t);
  S.redAlert=items.some(i=>i.alert);
  const txt=items.length?items.slice(0,30).map(i=>i.txt).join('   ◆   ')
    :'AWAITING FLEET DATA — FEEDS SYNC ~30 MIN';
  if(txt!==S.tickerText){S.tickerText=txt;S.tickerX=1264;}
}

/* ═══════════════ render ═══════════════ */
const cv=$('scene'),ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,SC=1,OX=0,OY=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  SC=Math.min(VW/LW,VH/LH);OX=(VW-LW*SC)/2;OY=(VH-LH*SC)/2;
}
window.addEventListener('resize',resize);
const stars=[];
for(let i=0;i<220;i++)stars.push({x:Math.random()*LW,y:Math.random()*LH,
  z:0.2+Math.random()*0.8,r:Math.random()<0.9?1:2,tw:Math.random()*6});
function drawStars(dt){
  for(const s of stars){
    s.x-=s.z*9*dt;if(s.x<0){s.x=LW;s.y=Math.random()*LH;}
    const a=0.25+0.55*s.z+0.2*Math.sin(S.t*2+s.tw);
    ctx.fillStyle=S.redAlert?'rgba(255,120,140,'+clamp(a,0,1).toFixed(2)+')'
                            :'rgba(200,225,255,'+clamp(a,0,1).toFixed(2)+')';
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(6,10,20,0.93)';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(95,242,255,0.18)';ctx.lineWidth=1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function drawWall(dt){
  // wall band y0..150 with viewport window x430..850 y16..112
  panel(16,10,398,102);panel(866,10,398,102);
  panel(16,118,1248,28); // ticker strip
  // viewport frame
  ctx.strokeStyle=S.redAlert?'rgba(255,84,112,0.9)':'rgba(95,242,255,0.5)';
  ctx.lineWidth=3;ctx.strokeRect(430,16,420,96);
  ctx.strokeStyle='rgba(95,242,255,0.15)';ctx.lineWidth=8;ctx.strokeRect(424,10,432,108);
  if(S.redAlert){ctx.fillStyle='rgba(255,40,70,'+(0.10+0.06*Math.sin(S.t*5)).toFixed(3)+')';
    ctx.fillRect(430,16,420,96);}
  // title + feed dots (left panel)
  ctx.textAlign='left';ctx.fillStyle='#5ff2ff';ctx.font='bold 17px "Courier New",monospace';
  ctx.fillText('FLEET COMMAND',34,44);
  ctx.fillStyle='#8b9bb8';ctx.font='10px "Courier New",monospace';
  ctx.fillText("JOSEPH'S BRIDGE // LIVE FEED",34,62);
  // feed dots — kept inside the left panel (x 16..414), left of the viewport frame
  const dots=S.bays.slice(0,6),slot=(406-34)/Math.max(dots.length,1);
  dots.forEach((b,i)=>{
    const dx=34+i*slot;
    const st=!b.feed.ok?'#ff5470':b.dark?'#ffbf47':'#51ff9e';
    ctx.fillStyle=st;ctx.beginPath();ctx.arc(dx,82,5,0,7);ctx.fill();
    ctx.fillStyle='#8b9bb8';ctx.font='9px "Courier New",monospace';
    ctx.fillText(fitLabel(b.ai.slice(0,9).toUpperCase(),slot-14),dx+9,85);
  });
  // clock + alert (right panel)
  ctx.textAlign='right';ctx.fillStyle='#8b9bb8';ctx.font='12px "Courier New",monospace';
  ctx.fillText(new Date().toISOString().slice(11,19)+' UTC',1246,44);
  ctx.fillStyle='#5ff2ff';ctx.font='10px "Courier New",monospace';
  ctx.fillText('DATA: data/registry.json · 60s',1246,62);
  if(S.redAlert&&Math.floor(S.t*2)%2===0){
    ctx.fillStyle='#ff5470';ctx.font='bold 13px "Courier New",monospace';
    ctx.fillText('⚠ RED ALERT — JOB FAILED',1246,92);
  }
  // ticker — seamless marquee, clipped to the strip (x 16..1264)
  ctx.textAlign='left';ctx.font='12px "Courier New",monospace';
  ctx.fillStyle=S.redAlert?'#ffb3c0':'#bfe9ff';
  const tkw=ctx.measureText(S.tickerText).width||1, period=tkw+140;
  ctx.save();ctx.beginPath();ctx.rect(16,119,1248,26);ctx.clip();
  ctx.fillText(S.tickerText,S.tickerX,137);
  ctx.fillText(S.tickerText,S.tickerX+period,137);
  ctx.restore();
  S.tickerX-=55*dt;
  if(S.tickerX<=1264-period)S.tickerX+=period;
  ctx.textAlign='left';
}
function drawDeck(){
  const g=ctx.createLinearGradient(0,150,0,600);
  g.addColorStop(0,'#0a1226');g.addColorStop(1,'#060b16');
  ctx.fillStyle=g;ctx.fillRect(0,150,LW,450);
  ctx.strokeStyle='rgba(95,242,255,0.07)';ctx.lineWidth=1;
  for(let y=190;y<600;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(LW,y);ctx.stroke();}
  for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(640+i*40,150);ctx.lineTo(640+i*150,600);ctx.stroke();}
  // doors
  for(const dx of [0,LW-36]){
    ctx.fillStyle='#0d1528';ctx.fillRect(dx,460,36,100);
    ctx.strokeStyle='rgba(95,242,255,0.35)';ctx.strokeRect(dx+0.5,460.5,35,99);
    ctx.fillStyle='rgba(95,242,255,0.12)';ctx.fillRect(dx+14,470,8,80);
  }
}
function drawBays(dt){
  for(const b of S.bays){
    if(b.ai in S.bayEnter)S.bayEnter[b.ai]=Math.min(1,S.bayEnter[b.ai]+dt*1.4);
    const en=S.bayEnter[b.ai]||1;
    ctx.save();ctx.globalAlpha=en;ctx.translate((1-en)*46,0);
    // label plate
    ctx.fillStyle='rgba(8,14,28,0.9)';ctx.fillRect(b.x+6,164,b.w-12,28);
    ctx.fillStyle=b.color;ctx.fillRect(b.x+6,164,4,28);
    ctx.fillStyle=b.dark?'#5a6578':'#e6f0ff';
    ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='left';
    const nm=b.label.length>18?b.label.slice(0,17)+'…':b.label;
    ctx.fillText(nm.toUpperCase(),b.x+16,182);
    ctx.fillStyle=!b.feed.ok?'#ff5470':b.dark?'#ffbf47':'#51ff9e';
    ctx.beginPath();ctx.arc(b.x+b.w-20,178,5,0,7);ctx.fill();
    // stations — crew drawn first (behind console), console over the top
    b.stations.forEach((st,i)=>{
      const sp=st.spec;
      if(st.command){
        if(!b.dark){
          drawCrew(ctx,st.x,368,{color:b.color,pose:sp.status==='on_duty'?'work':'stand',f:Math.floor(S.t*3)%2,t:S.t});
          drawConsole(ctx,st.x,400,116,b.color,false,true);
          // radar sweep on command screen
          const sx=st.x,sy=400-58+10+13;
          ctx.save();ctx.strokeStyle=b.color;ctx.globalAlpha=0.7;ctx.lineWidth=1.5;
          ctx.beginPath();ctx.moveTo(sx,sy);
          ctx.lineTo(sx+Math.cos(S.t*2)*40,sy+Math.sin(S.t*2)*11);ctx.stroke();ctx.restore();
          S.hits.push({x:st.x,y:352,r:20,type:'spec',ref:{b:b,spec:sp}});
        }else{
          drawConsole(ctx,st.x,400,116,b.color,true,true);
          drawCrew(ctx,st.x,414,{color:b.color,pose:'sit',t:S.t,dim:true});
          S.hits.push({x:st.x,y:398,r:20,type:'spec',ref:{b:b,spec:sp}});
        }
        ctx.fillStyle=b.dark?'#5a6578':b.color;ctx.font='9px "Courier New",monospace';ctx.textAlign='center';
        ctx.fillText((sp.name||'Captain').toUpperCase(),st.x,428);
      }else{
        if(!b.dark){
          if(sp.status==='on_duty'){
            drawCrew(ctx,st.x,368,{color:b.color,pose:'work',f:Math.floor(S.t*3)%2,t:S.t});
            drawConsole(ctx,st.x,400,46,b.color,false,false);
            S.hits.push({x:st.x,y:352,r:18,type:'spec',ref:{b:b,spec:sp}});
          }else{
            // standby: seated on stool beside console, still visible
            drawConsole(ctx,st.x,400,46,b.color,false,false);
            ctx.fillStyle='#1a2440';ctx.fillRect(st.x+22,386,16,14);
            drawCrew(ctx,st.x+30,400,{color:b.color,pose:'sit',t:S.t+i});
            S.hits.push({x:st.x+30,y:384,r:16,type:'spec',ref:{b:b,spec:sp}});
          }
        }else{
          drawConsole(ctx,st.x,400,46,b.color,true,false);
          drawCrew(ctx,st.x,414,{color:b.color,pose:'sit',t:S.t,dim:true});
          S.hits.push({x:st.x,y:398,r:18,type:'spec',ref:{b:b,spec:sp}});
        }
        ctx.fillStyle=b.dark?'#3a4358':'#8b9bb8';ctx.font='7px "Courier New",monospace';ctx.textAlign='center';
        ctx.fillText((sp.name||sp.id||'').toUpperCase(),st.x,428);
      }
    });
    if(!b.stations.length){
      ctx.fillStyle='#3a4358';ctx.font='10px "Courier New",monospace';ctx.textAlign='center';
      ctx.fillText(b.dark?'— NO SIGNAL —':'AWAITING CREW',b.x+b.w/2,300);
    }
    ctx.restore();
  }
  ctx.textAlign='left';
}
function drawWalkers(dt){
  for(const w of S.walkers){
    if(w.state==='enter'||w.state==='leave'){
      const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy)||1;
      w.ft=(w.ft||0)+dt;if(w.ft>0.13){w.ft=0;w.frame=(w.frame+1)%4;}
      if(d<7){w.state=w.state==='enter'?'work':'gone';}
      else{const s=Math.min(d,w.speed*dt);w.x+=dx/d*s;w.y+=dy/d*s;}
    }
  }
  S.walkers=S.walkers.filter(w=>w.state!=='gone');
  ctx.textAlign='center';
  for(const w of S.walkers){
    const moving=w.state==='enter'||w.state==='leave';
    drawCrew(ctx,w.x,w.y,{color:w.color,pose:moving?'walk':'work',f:w.frame||Math.floor(S.t*3)%2,t:S.t+w.phase});
    // name + elapsed tag
    const a=w.agent||{};
    let el=a.elapsed_s||0;
    if(a.started_at){const p=(Date.now()-Date.parse(a.started_at))/1000;if(!isNaN(p)&&p>=0)el=p;}
    const nm=String(a.name||'agent').slice(0,26);
    ctx.font='10px "Courier New",monospace';
    const tw=Math.max(ctx.measureText(nm).width,ctx.measureText(fmtElapsed(el)).width)+12;
    ctx.fillStyle='rgba(5,9,18,0.85)';ctx.fillRect(w.x-tw/2,w.y-58,tw,30);
    ctx.strokeStyle=w.color;ctx.globalAlpha=0.5;ctx.strokeRect(w.x-tw/2+0.5,w.y-57.5,tw-1,29);ctx.globalAlpha=1;
    ctx.fillStyle='#e6f0ff';ctx.fillText(nm,w.x,w.y-46);
    ctx.fillStyle=w.color;ctx.fillText(fmtElapsed(el),w.x,w.y-34);
    S.hits.push({x:w.x,y:w.y-14,r:20,type:'live',ref:{w:w}});
  }
  ctx.textAlign='left';
}
function drawLounge(){
  panel(1010,164,254,426);
  ctx.fillStyle='#5ff2ff';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='left';
  ctx.fillText('LOUNGE — CREW AT REST',1022,184);
  for(const p of S.pods){
    const ch=p.chat;
    // chair
    ctx.fillStyle='#16223c';ctx.fillRect(p.x-34,p.y-32,68,40);
    ctx.fillStyle='#1f2c4e';ctx.fillRect(p.x-34,p.y-32,68,8);
    drawCrew(ctx,p.x,p.y+4,{color:p.color,pose:'rest',t:S.t+p.x,dim:p.dark});
    ctx.fillStyle=p.dark?'#3a4358':'#8b9bb8';ctx.font='9px "Courier New",monospace';ctx.textAlign='center';
    const nm=String(ch.name||'chat').slice(0,20);
    ctx.fillText(nm,p.x,p.y-38);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-30,p.y-41,3,0,7);ctx.fill();
    S.hits.push({x:p.x,y:p.y-10,r:26,type:'chat',ref:{p:p}});
  }
  ctx.textAlign='left';
}
function drawDock(){
  ctx.fillStyle='rgba(6,10,20,0.93)';ctx.fillRect(0,600,LW,120);
  ctx.strokeStyle='rgba(95,242,255,0.18)';ctx.beginPath();ctx.moveTo(0,600.5);ctx.lineTo(LW,600.5);ctx.stroke();
  ctx.fillStyle='#5ff2ff';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='left';
  ctx.fillText('SERVICE DOCK — SCHEDULED JOBS',24,618);
  for(const bt of S.bots){
    drawBot(ctx,bt.x,bt.y,{color:bt.dark?'#3a4358':bt.color,status:bt.status,t:S.t});
    ctx.fillStyle=bt.dark?'#3a4358':'#8b9bb8';ctx.font='7px "Courier New",monospace';ctx.textAlign='center';
    ctx.fillText(fitLabel(bt.job.name||bt.job.id||'job',58),bt.x,bt.y+12);
    S.hits.push({x:bt.x,y:bt.y-13,r:20,type:'bot',ref:{bt:bt}});
  }
  if(S.botOverflow>0){
    ctx.fillStyle='#8b9bb8';ctx.font='10px "Courier New",monospace';ctx.textAlign='right';
    ctx.fillText('+'+S.botOverflow+' more',1256,690);
  }
  ctx.textAlign='left';
}
function drawOverlays(){
  if(S.feeds.length===0){
    ctx.textAlign='center';ctx.fillStyle='#5ff2ff';ctx.font='bold 26px "Courier New",monospace';
    ctx.fillText('AWAITING DATA',640,360);
    ctx.fillStyle='#8b9bb8';ctx.font='13px "Courier New",monospace';
    ctx.fillText(S.syncErr?'sync error: '+String(S.syncErr).slice(0,80):'connecting to data/registry.json…',640,388);
    ctx.textAlign='left';return;
  }
  if(!S.feeds.some(e=>e.ok)){
    ctx.textAlign='center';ctx.fillStyle='#ff5470';ctx.font='bold 22px "Courier New",monospace';
    ctx.fillText('ALL FEEDS OFFLINE',640,360);ctx.textAlign='left';
  }
}

/* ═══════════════ detail card (tap a crew member) ═══════════════ */
function cardPos(lx,ly){
  const sx=OX+lx*SC,sy=OY+ly*SC,card=$('card');
  card.classList.add('show');
  const w=Math.min(320,VW*0.86),h=card.offsetHeight||160;
  card.style.left=clamp(sx+14,8,VW-w-8)+'px';
  card.style.top=clamp(sy-h-10,8,VH-h-8)+'px';
}
function showCard(kind,title,rows,lx,ly){
  $('card-k').textContent=kind;$('card-t').textContent=title;
  $('card-b').innerHTML=rows.map(r=>'<div class="row"><b>'+esc(r[0])+':</b> '+esc(r[1])+'</div>').join('')
    +(rows.task?'<div class="task">'+esc(rows.task)+'</div>':'');
  cardPos(lx,ly);
}
function hideCard(){$('card').classList.remove('show');}
$('card-x').addEventListener('click',ev=>{ev.stopPropagation();hideCard();});
function onTap(lx,ly){
  for(let i=S.hits.length-1;i>=0;i--){
    const h=S.hits[i],dx=lx-h.x,dy=ly-h.y;
    if(dx*dx+dy*dy<=h.r*h.r){
      const r=h.ref;
      if(h.type==='live'){const a=r.w.agent||{};
        let el=a.elapsed_s||0;
        if(a.started_at){const p=(Date.now()-Date.parse(a.started_at))/1000;if(!isNaN(p)&&p>=0)el=p;}
        const rows=[['AI',r.w.ai],['Project',a.project||'?'],['Specialist',a.specialist||'?'],
          ['Elapsed',fmtElapsed(el)],['Status','running']];rows.task=a.task||'';
        showCard('LIVE AGENT',a.name||'agent',rows,lx,ly);return;
      }
      if(h.type==='spec'){const sp=r.spec,b=r.b;
        const rows=[['AI',b.label],['Specialty',sp.specialty||'?'],
          ['Status',b.dark?'NO SIGNAL':sp.status||'?']];
        if(b.dark)rows.push(['Feed',!b.feed.ok?'fetch failed':'stale > 45 min']);
        showCard('SPECIALIST',sp.name||sp.id||'specialist',rows,lx,ly);return;
      }
      if(h.type==='bot'){const j=r.bt.job;
        const rows=[['AI',r.bt.ai],['Schedule',j.schedule||'?'],
          ['Last run',(j.last_run?ago(j.last_run):'never')+' · '+(j.last_status||'never')],
          ['Next run',j.next_run?ago(j.next_run).replace(' ago','')+' left':'?']];
        showCard('SCHEDULED JOB',j.name||j.id||'job',rows,lx,ly);return;
      }
      if(h.type==='chat'){const ch=r.p.chat;
        const rows=[['AI',r.p.ai],['Status','docked'],
          ['Last active',ch.last_active?ago(ch.last_active):'?']];
        showCard('DOCKED CHAT',ch.name||'chat',rows,lx,ly);return;
      }
    }
  }
  hideCard();
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  onTap((e.clientX-r.left-OX)/SC,(e.clientY-r.top-OY)/SC);
});

/* ═══════════════ main loop ═══════════════ */
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  const dt=clamp((now-lastT)/1000,0,0.1)||0.016;lastT=now;S.t+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#04060d';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  S.hits.length=0;
  drawStars(dt);
  drawWall(dt);
  drawDeck();
  drawBays(dt);
  drawWalkers(dt);
  drawLounge();
  drawDock();
  drawOverlays();
}
/* ═══════════════ boot ═══════════════ */
resize();
sync();
setInterval(sync,POLL_MS);
requestAnimationFrame(frame);
</script>
