name: Sync fleet data from Drive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch registry and feeds from Drive
        run: |
          mkdir -p data
          python3 - <<'PYEOF'
          import json, urllib.request
          REG = "171CYV4j-kGAGbZrI0kHSepiVvsyC6WQJ"
          def get(fid):
              url = f"https://drive.google.com/uc?export=download&id={fid}"
              req = urllib.request.Request(url, headers={"User-Agent": "fleet-command-sync"})
              return urllib.request.urlopen(req, timeout=30).read()
          reg = json.loads(get(REG))
          out = []
          for f in reg.get("feeds", []):
              ai = f["ai"]
              try:
                  raw = get(f["fileId"])
                  json.loads(raw)
                  with open(f"data/fleet-{ai}.json", "w") as fh:
                      fh.write(raw.decode("utf-8"))
                  out.append({"ai": ai, "label": f.get("label", ai), "file": f"fleet-{ai}.json"})
              except Exception as e:
                  print(f"feed {ai} failed: {e}")
          with open("data/registry.json", "w") as fh:
              json.dump({"updated_at": reg.get("updated_at"), "feeds": out}, fh, indent=2)
          print(f"wrote {len(out)} feed(s)")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "fleet-command-sync"
          git config user.email "fleet-command-sync@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fleet data sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
