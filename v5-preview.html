<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fleet Command — Joseph's AI Fleet</title>
<link rel="icon" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<style>
/* ══════════ Fleet Command v5 — takeover build ══════════ */
:root{
  --bg:#04060d; --cyan:#5ff2ff; --green:#51ff9e; --amber:#ffbf47; --red:#ff5470;
  --muted:#8b9bb8; --text:#e6f0ff; --panel:rgba(8,15,28,.92); --line:rgba(95,242,255,.25);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
  pointer-events:none;z-index:5}
#hud .brand{font-size:13px;letter-spacing:4px;color:var(--cyan);font-weight:700;
  text-shadow:0 0 10px rgba(95,242,255,.55);white-space:nowrap}
#hud .sub{font-size:10px;color:var(--muted);letter-spacing:1px;white-space:nowrap}
#hud .sp{flex:1}
#hud .sync{font-size:10px;color:var(--muted);letter-spacing:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hud .sync.err{color:var(--red)}
.hbtn{pointer-events:auto;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;
  background:rgba(95,242,255,.07);color:var(--text);font-size:11px;letter-spacing:2px;font-weight:600;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hbtn:active{background:rgba(95,242,255,.2)}
.hbtn.on{border-color:var(--green);color:var(--green)}
#card{position:fixed;z-index:10;max-width:min(320px,86vw);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none;
  box-shadow:0 8px 30px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#card.show{display:block}
#card .k{font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:2px}
#card .t{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
#card .row{font-size:12px;color:var(--text);line-height:1.5;word-break:break-word}
#card .row b{color:var(--cyan);font-weight:600}
#card .task{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45;word-break:break-word}
#card .x{position:absolute;top:6px;right:10px;color:var(--muted);font-size:16px;cursor:pointer;padding:4px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <div><div class="brand">FLEET COMMAND</div><div class="sub" id="hud-sub">BRIDGE // LIVE</div></div>
  <div class="sp"></div>
  <div class="sync" id="hud-sync">connecting…</div>
  <button class="hbtn" id="abtn" title="toggle ambience">🔇 SOUND</button>
</div>
<div id="card"><span class="x" id="card-x">×</span><div class="k" id="card-k"></div><div class="t" id="card-t"></div><div id="card-b"></div></div>
<script>
'use strict';
/* ═══════════════ v5 — takeover build ("little guys walking around a spaceship")
   Full-viewport canvas bridge. Zero dependencies. All crew, jobs, chats and
   ticker render from data/registry.json + data/fleet-<ai>.json ONLY.
   No hardcoded telemetry, no demo data, no external services. Ever. */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(s){s=String(s||'?');let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function shade(hex,amt){const n=parseInt(String(hex).slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255,p=Math.abs(amt);r=Math.round(lerp(r,t,p));g=Math.round(lerp(g,t,p));b=Math.round(lerp(b,t,p));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function hexA(hex,a){const n=parseInt(String(hex).slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function fmtElapsed(s){s=Math.max(0,Math.floor(s||0));if(s<60)return s+'s';const m=Math.floor(s/60);
  if(m<60)return m+'m';return Math.floor(m/60)+'h '+(m%60)+'m';}
function ago(iso){const d=Date.now()-Date.parse(iso);return isNaN(d)?'?':fmtElapsed(d/1000)+' ago';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fitLabel(text,maxW){
  text=String(text);
  if(ctx.measureText(text).width<=maxW)return text;
  const words=text.split(/\s+/);let out='';
  for(const wd of words){
    const cand=out?out+' '+wd:wd;
    if(ctx.measureText(cand+'…').width>maxW)break;
    out=cand;
  }
  if(!out){out=text;while(out.length>1&&ctx.measureText(out+'…').width>maxW)out=out.slice(0,-1);}
  return out+'…';
}

/* ── logical scene size ── */
const LW=1280, LH=720;
const STALE_MS=45*60*1000, POLL_MS=60*1000;
/* room + corridor geometry */
const ROOM_Y=170, ROOM_H=280, ROOM_BOT=450;   // rooms: y 170..450
const CORR_TOP=470, CORR_Y=512, CORR_BOT=556; // corridor strip
const CORR_XS=[16,150,290,430,570,710,850,984];

/* ── state ── */
const S={feeds:[],t:0,redAlert:false,tickerText:'',tickerX:1264,crew:[],hits:[],
  rooms:[],bots:[],pods:[],syncAt:null,syncErr:null,roomEnter:{},botOverflow:0};

/* ── data: registry + feeds, re-polled every 60s ── */
async function fetchJSON(url){const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function loadFeed(meta){
  try{
    let url=null;
    if(meta.file)url='data/'+meta.file;
    else if(meta.url)url=meta.url;
    else if(meta.fileId)url='https://drive.google.com/uc?export=download&id='+meta.fileId;
    if(!url)throw new Error('no source');
    const feed=await fetchJSON(url+(url.indexOf('?')>=0?'&':'?')+'t='+Date.now());
    if(!feed||typeof feed!=='object')throw new Error('bad feed');
    return {meta:meta,feed:feed,ok:true};
  }catch(e){return {meta:meta,feed:null,ok:false,err:String((e&&e.message)||e)};}
}
async function sync(){
  try{
    const reg=await fetchJSON('data/registry.json?t='+Date.now());
    const metas=(reg&&Array.isArray(reg.feeds))?reg.feeds:[];
    const res=await Promise.all(metas.map(loadFeed));
    S.feeds=res;S.syncAt=new Date();S.syncErr=null;
  }catch(e){S.syncErr=String((e&&e.message)||e);}
  reconcile();buildTicker();updateHud();
}
/* A feed is LIVE only when it carries a real ai id and is not a placeholder.
   Anything else is an honest NO SIGNAL — never rendered as active. */
function isLive(e){return !!(e&&e.ok&&e.feed&&e.feed.ai&&!e.feed.placeholder);}
function feedAgeMs(e){if(!isLive(e)||!e.feed.updated_at)return Infinity;
  const t=Date.parse(e.feed.updated_at);return isNaN(t)?Infinity:Date.now()-t;}
function isStale(e){return !isLive(e)||feedAgeMs(e)>STALE_MS;}
function aiColor(ai,idx){const C={sebastian:'#5ff2ff',claude:'#ff9f43',grok:'#c084fc',
  gemini:'#2dd4bf',chatgpt:'#a3e635'};if(C[ai])return C[ai];
  const E=['#ff6b9d','#ffd166','#8aff80','#7ddcff','#ff9e7d','#b8a7ff'];
  return E[(hash(ai)+(idx||0))%E.length];}
function updateHud(){
  const el=$('hud-sync');
  if(S.syncErr){el.textContent='sync error';el.className='sync err';}
  else if(S.syncAt){const n=S.feeds.filter(e=>isLive(e)&&!isStale(e)).length;
    el.textContent='sync '+S.syncAt.toLocaleTimeString()+' · '+n+'/'+S.feeds.length+' live';el.className='sync';}
  $('hud-sub').textContent=S.redAlert?'BRIDGE // RED ALERT':'BRIDGE // LIVE';
}

/* ── ambient audio (Web Audio, OFF by default) ── */
let AC=null,audioOn=false,audioNodes=null;
function setAudio(on){
  audioOn=on;$('abtn').textContent=on?'🔊 SOUND':'🔇 SOUND';$('abtn').classList.toggle('on',on);
  if(on){
    if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}
    if(AC.state==='suspended')AC.resume();
    if(audioNodes)return;
    const g=AC.createGain();g.gain.value=0.5;g.connect(AC.destination);
    const hum=AC.createOscillator();hum.type='sine';hum.frequency.value=48;
    const hg=AC.createGain();hg.gain.value=0.05;hum.connect(hg);hg.connect(g);hum.start();
    const hum2=AC.createOscillator();hum2.type='triangle';hum2.frequency.value=96.5;
    const hg2=AC.createGain();hg2.gain.value=0.015;hum2.connect(hg2);hg2.connect(g);hum2.start();
    const scale=[220,261.63,293.66,329.63,392,440,523.25];
    let step=0;
    const timer=setInterval(()=>{
      if(!audioOn)return;
      const o=AC.createOscillator();o.type='square';o.frequency.value=scale[step%scale.length];
      const og=AC.createGain();og.gain.setValueAtTime(0.018,AC.currentTime);
      og.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.28);
      o.connect(og);og.connect(g);o.start();o.stop(AC.currentTime+0.3);
      step+=[1,2,1,3,1,2,4][Math.floor(Math.random()*7)];
    },420);
    audioNodes={g:g,timer:timer};
  }else if(audioNodes){clearInterval(audioNodes.timer);audioNodes=null;
    if(AC)AC.suspend();}
}
function sfxClick(){
  if(!audioOn||!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=740;
    g.gain.setValueAtTime(0.07,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.09);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.1);
  }catch(e){}
}
$('abtn').addEventListener('click',()=>setAudio(!audioOn));

/* ═══════════════ v5 pixel crew sprites — original renderer ═══════════════
   Salvaged CONCEPTS from Gemini's rejected build: a procedural pixel
   character with articulated walk/work/idle/rest states, a floating
   nameplate with status LED, per-AI headgear, and walk-cycle bob.
   Every line below is written fresh for v5 — none of Gemini's code,
   data, or copy was carried over.
   Grid 14x16, u=2 → 28x32 px. Origin x,y = feet center. */
const SKIN='#f0c8a0';
function headgear(R,ai,color,dim){
  const hg=dim?'#2a3247':color;
  if(ai==='sebastian'){R(3,0,8,2,hg);R(4,1,6,1,dim?'#2a3247':'#f4c442');} /* captain's peaked cap */
  else if(ai==='gemini'){R(5,0,1,2,hg);R(8,0,1,2,hg);}
  else if(ai==='claude'){R(4,0,2,1,hg);R(8,0,2,1,hg);}
  else if(ai==='grok'){R(6,0,2,2,hg);}
  else{R(6,0,2,2,hg);}
}
function drawNameplate(x,y,name,color,led){
  ctx.save();ctx.font='9px "Courier New",monospace';ctx.textAlign='left';
  const nm=fitLabel(name,110);
  const w=ctx.measureText(nm).width+22;
  ctx.fillStyle='rgba(5,9,18,0.88)';ctx.fillRect(x-w/2,y-14,w,14);
  ctx.strokeStyle=color;ctx.globalAlpha=0.65;ctx.lineWidth=1;
  ctx.strokeRect(x-w/2+0.5,y-13.5,w-1,13);ctx.globalAlpha=1;
  ctx.fillStyle=led;ctx.beginPath();ctx.arc(x-w/2+8,y-7,2.6,0,7);ctx.fill();
  ctx.fillStyle='#e6f0ff';ctx.fillText(nm,x-w/2+13,y-4);
  ctx.restore();
}
function drawSprite(x,y,o){
  o=o||{};
  const color=o.color||'#5ff2ff',mode=o.mode||'idle',dim=!!o.dim;
  const t=o.t||0,frame=o.frame||0,ai=o.ai||'',seed=o.seed||0,flip=o.flip||1;
  const suit=dim?'#232c44':color,suitD=dim?'#1a2135':shade(color,-0.38),
        skin=dim?'#6b5f52':SKIN,dark=dim?'#101625':'#141d33',visor='#0b1626';
  ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(flip,1);
  /* shadow + team aura (unbobbed) */
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();ctx.ellipse(0,-1,11,4,0,0,7);ctx.fill();
  if(!dim){const g=ctx.createRadialGradient(0,-16,2,0,-16,24);
    g.addColorStop(0,hexA(color,0.16));g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-16,24,0,7);ctx.fill();}
  const bob=mode==='walk'?((frame%2)?-2:0)
    :(mode==='work'?Math.round(Math.sin(t*9+seed)*1)
    :Math.round(Math.sin(t*2+seed)*1.4));
  ctx.translate(0,bob);
  const R=(gx,gy,w,h,col)=>{ctx.fillStyle=col;
    ctx.fillRect(Math.round((gx-7)*2),Math.round((gy-16)*2),Math.round(w*2),Math.round(h*2));};
  const blink=!dim&&(Math.floor(t*1.7+seed)%11===0);
  if(mode==='rest'||mode==='cryo'){
    /* sleeping / stasis: curled, dim, slow breath */
    R(4,7,6,5,suit);R(5,8,4,1,suitD);
    R(5,2,4,4,skin);R(5,4,4,1,visor);
    R(3,7,1,4,suitD);R(10,7,1,4,suitD);
    R(3,11,8,2,dark);
    if(mode==='cryo'){ctx.fillStyle=hexA(color,0.10+0.06*Math.sin(t*1.2));ctx.fillRect(-14,-30,28,32);}
    if(!dim&&Math.floor(t*0.6+seed)%5===0){
      ctx.fillStyle='#9fd8ff';ctx.font='9px "Courier New",monospace';ctx.fillText('z',20,-24);}
  }else if(mode==='sit'){
    R(5,6,4,5,suit);R(6,7,2,1,dim?'#1a2135':shade(color,0.35));
    R(3,10,8,2,dark);R(3,10,2,3,dark);
    R(5,1,4,4,skin);R(5,3,4,1,visor);
    R(4,6,1,4,suitD);R(9,6,1,4,suitD);
    if(!dim)R(5,3,1,1,color);
  }else{
    /* head + per-AI headgear + blinking visor eyes */
    R(5,1,4,4,skin);
    headgear(R,ai,color,dim);
    R(5,3,4,1,visor);
    if(blink){R(5,3,4,1,skin);}
    else if(!dim){R(5,3,1,1,color);R(8,3,1,1,color);}
    /* torso */
    R(5,5,4,5,suit);R(6,6,2,1,dim?'#1a2135':shade(color,0.4));
    if(mode==='work'){
      /* arms forward, typing; holo-keyboard + rising code sparks */
      const ty=(frame%2)?2.6:3.2;
      R(4,5,1,3,suitD);R(9,5,1,3,suitD);
      R(4,ty,2,1,skin);R(8,ty,2,1,skin);
      if(!dim){ctx.fillStyle=hexA(color,0.5);ctx.fillRect(-11,-8,22,2);
        const sy=-26-((t*20+seed*7)%14);
        ctx.fillStyle='#4ade80';ctx.font='7px "Courier New",monospace';ctx.textAlign='center';
        ctx.fillText(frame%2?'01':'<>',(frame-1.5)*6,sy);ctx.textAlign='left';}
    }else{
      R(4,5,1,4,suitD);R(9,5,1,4,suitD);
      R(4,9,1,1,skin);R(9,9,1,1,skin);
    }
    /* legs: 4-frame walk stride, standing otherwise */
    if(mode==='walk'){
      if(frame===0){R(5,10,2,4,dark);R(7,11,2,4,dark);}
      else if(frame===2){R(5,11,2,4,dark);R(7,10,2,4,dark);}
      else{R(5,10,2,5,dark);R(7,10,2,5,dark);}
      ctx.translate(frame===1?1:frame===3?-1:0,0);
    }else{R(5,10,2,5,dark);R(7,10,2,5,dark);}
  }
  ctx.restore();
  if(o.name&&!o.noPlate){
    const led=mode==='work'?'#4ade80':mode==='walk'?'#5ff2ff':dim?'#3a4358':'#ffbf47';
    drawNameplate(x,y-40,o.name,o.noPlateColor||color,led);
  }
}
/* service bot (scheduled job): 30x26 — carried over from v4 */
function drawBot(x,y,o){
  o=o||{};const t=o.t||0;
  const st=o.status||'never';
  const glow=st==='ok'?'#51ff9e':st==='error'?'#ff5470':'#4a5872';
  ctx.save();ctx.translate(Math.round(x),Math.round(y));
  ctx.fillStyle='#1a2440';ctx.fillRect(-15,-26,30,26);
  ctx.fillStyle='#242f52';ctx.fillRect(-15,-26,30,6);
  ctx.fillStyle=o.color||'#5ff2ff';ctx.fillRect(-11,-22,22,3);
  const fl=st==='error'?(Math.floor(t*6)%2===0):false;
  ctx.fillStyle=fl?'#3a2030':glow;
  ctx.beginPath();ctx.arc(0,-14,4,0,7);ctx.fill();
  if(st==='ok'||(fl&&st==='error')){ctx.fillStyle=glow;ctx.globalAlpha=0.25;
    ctx.beginPath();ctx.arc(0,-14,9,0,7);ctx.fill();ctx.globalAlpha=1;}
  ctx.fillStyle='#0d1428';ctx.fillRect(-15,-6,30,6);
  ctx.fillStyle='#2a3558';for(let i=-12;i<12;i+=6)ctx.fillRect(i,-5,3,4);
  ctx.restore();
}
/* console station — carried over from v4 */
function drawConsole(x,baseY,w,color,dark,big){
  const h=big?58:40;
  ctx.save();ctx.translate(Math.round(x),Math.round(baseY));
  ctx.fillStyle=dark?'#0a0e1a':'#16223c';
  ctx.fillRect(-w/2,-h,w,h);
  ctx.fillStyle=dark?'#070b14':'#1f2c4e';
  ctx.fillRect(-w/2,-h,w,6);
  const sw=w-14,sh=big?26:16;
  ctx.fillStyle=dark?'#05070d':'#04121e';
  ctx.fillRect(-sw/2,-h+10,sw,sh);
  if(!dark){
    ctx.fillStyle=color;ctx.globalAlpha=0.28;ctx.fillRect(-sw/2,-h+10,sw,sh);ctx.globalAlpha=1;
    ctx.strokeStyle=color;ctx.globalAlpha=0.8;ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<=sw;i+=4){const yy=-h+10+sh/2+Math.sin(i*0.3+S.t*3)*sh*0.22;
      i===0?ctx.moveTo(-sw/2+i,yy):ctx.lineTo(-sw/2+i,yy);}
    ctx.stroke();ctx.globalAlpha=1;
  }else if(Math.floor(S.t*1.6)%2===0){
    ctx.fillStyle='#ff5470';ctx.font='bold 9px "Courier New",monospace';ctx.textAlign='center';
    ctx.fillText('NO SIGNAL',0,-h+10+sh/2+3);ctx.textAlign='left';
  }
  ctx.restore();
}

/* ═══════════════ rooms, corridor waypoints, walking ═══════════════
   Salvaged CONCEPT from Gemini's build: crew physically walk between
   rooms along corridor waypoints instead of standing static or
   teleporting. Implementation is v5-original: a simple corridor-node
   routing (no invented A* claims), rooms with door gaps, persistent
   crew entities with walk/work/rest modes driven ONLY by feed data. */
function stationFor(r,specId){
  if(!r||!r.stations||!r.stations.length)return null;
  return r.stations.find(s=>s.specId===specId)||r.stations[0];
}
/* route an entity to dest {x,y,room} via corridor waypoints.
   room = room ref (door gap at room.doorX) or null (lounge/corridor). */
function routePath(ent,dest){
  const pts=[];
  const curDoor=(ent.room&&ent.y<470)?ent.room.doorX:null;
  const dstDoor=(dest.room&&dest.y<470)?dest.room.doorX:null;
  let cx=ent.x;
  if(curDoor!=null){pts.push({x:curDoor,y:CORR_Y-48});cx=curDoor;}
  const tx=dstDoor!=null?dstDoor:clamp(dest.x,16,1000);
  const dir=tx>=cx?1:-1;
  for(const nx of CORR_XS){
    if(dir>0?(nx>cx+4&&nx<tx-4):(nx<cx-4&&nx>tx+4))pts.push({x:nx,y:CORR_Y});
  }
  pts.push({x:tx,y:CORR_Y});
  if(dstDoor!=null&&dest.y<470)pts.push({x:dstDoor,y:CORR_Y-48});
  pts.push({x:dest.x,y:dest.y});
  return pts.filter(p=>Math.hypot(p.x-ent.x,p.y-ent.y)>10);
}
function stepCrew(dt){
  for(const e of S.crew){
    if(e.mode==='walk'){
      if(e.path.length){
        const wp=e.path[0],dx=wp.x-e.x,dy=wp.y-e.y,d=Math.hypot(dx,dy)||1;
        e.ft=(e.ft||0)+dt;if(e.ft>0.12){e.ft=0;e.frame=((e.frame||0)+1)%4;}
        if(dx<-2)e.flip=-1;else if(dx>2)e.flip=1;
        if(d<8)e.path.shift();
        else{const s=Math.min(d,(e.speed||90)*dt);e.x+=dx/d*s;e.y+=dy/d*s;}
      }
      if(!e.path.length){
        if(e.removeWhenArrived){e.gone=true;}
        else if(e.returnTo){ /* stroll over — head back to the post */
          const rt=e.returnTo;e.returnTo=null;
          e.path=routePath(e,{x:rt.x,y:rt.y});e.destRoom=rt.room||null;
          e.afterWalk=rt.mode;
          if(!e.path.length){e.mode=rt.mode;e.room=rt.room||null;}
        }else{
          e.room=e.destRoom||null;e.destRoom=null;
          e.mode=e.afterWalk||e.destMode||'idle';e.afterWalk=null;
        }
      }
    }else if(!e.agent&&!e.removeWhenArrived&&(e.mode==='rest'||e.mode==='idle')){
      /* ambient wander: resting crew occasionally stroll the corridor.
         Purely visual — feed status never changes. */
      e.wanderT=(e.wanderT==null?10+Math.random()*20:e.wanderT)-dt;
      if(e.wanderT<=0){
        e.wanderT=14+Math.random()*22;
        const spots=[];
        for(const r of S.rooms)if(!r.dark&&isLive(r.feed))spots.push({x:r.doorX,y:CORR_Y});
        spots.push({x:80+Math.random()*880,y:CORR_Y});
        const t=spots[(Math.random()*spots.length)|0];
        e.returnTo={x:e.x,y:e.y,mode:e.mode,room:e.room||null};
        e.path=routePath(e,t);e.destRoom=null;
        if(e.path.length)e.mode='walk';else e.returnTo=null;

/* lounge rest slots: 2 columns x 4 rows, chats take column 0 first */
const LOUNGE_X0=1010,LOUNGE_X1=1264;
function loungeSlots(){
  const s=[];const xs=[LOUNGE_X0+66,LOUNGE_X1-66];
  for(let r=0;r<4;r++)for(let cix=0;cix<2;cix++)
    s.push({x:xs[cix],y:236+r*95});
  return s;
}
function reconcile(){
  /* rooms — one per registry feed, registry order; sebastian centered.
     Live feeds get a crew room; placeholder/stale feeds get a cryo module. */
  const rooms=[];let idx=0;
  for(const e of S.feeds){
    const ai=(isLive(e)&&e.feed.ai)||e.meta.ai||('ai'+idx);
    const label=(isLive(e)&&e.feed.label)||e.meta.label||ai;
    const color=aiColor(ai,idx);
    const specs=isLive(e)&&Array.isArray(e.feed.specialists)?e.feed.specialists:[];
    const dark=isStale(e);
    if(!(ai in S.roomEnter))S.roomEnter[ai]=0;
    rooms.push({ai:ai,label:label,color:color,specs:specs,dark:dark,feed:e,
      w:0,x:0,doorX:0,stations:[],enter:S.roomEnter[ai]||0});
    idx++;
  }
  const PAD=16;let sp=58;const MINSP=40;
  const widths=rooms.map(r=>r.dark?170:(r.specs.length?(r.specs.length*sp+PAD*2):150));
  const avail=984; // x 16..1000, lounge beyond
  let total=widths.reduce((a,b)=>a+b,0);
  if(total>avail&&total>0)sp=Math.max(MINSP,sp*avail/total);
  const ws=rooms.map(r=>r.dark?170:(r.specs.length?(r.specs.length*sp+PAD*2):150));
  total=ws.reduce((a,b)=>a+b,0);
  const sebI=rooms.findIndex(r=>r.ai==='sebastian');
  let order=rooms;
  if(sebI>=0){
    const others=rooms.filter((_,i)=>i!==sebI);
    const mid=Math.floor(others.length/2);
    order=others.slice(0,mid).concat([rooms[sebI]],others.slice(mid));
  }
  let x=16+Math.max(0,(avail-total)/2);
  const GAP=10;
  for(const r of order){
    r.w=ws[rooms.indexOf(r)];r.x=x;x+=r.w+GAP;
    r.doorX=r.x+r.w/2;
    if(!r.dark){
      r.specs.forEach((spc,j)=>{
        const sx=r.specs.length?(r.x+PAD+j*sp+sp/2):r.x+r.w/2;
        r.stations.push({specId:spc.id,spec:spc,x:sx,y:412,
          command:(spc.specialty==='command'&&r.ai==='sebastian')});
      });
    }
  }
  S.rooms=rooms;
  reconcileCrew();reconcileBots();reconcilePods();
}
function isOnDuty(r,sp){
  if(sp.status==='on_duty')return true;
  if(r.ai==='sebastian'&&sp.specialty==='command')return true; // Captain never sleeps
  return false;
}
function reconcileCrew(){
  const seen=new Set();
  /* standby crew get lounge slots in stable feed order */
  const standbyQueue=[];
  for(const r of S.rooms){
    if(r.dark||!isLive(r.feed))continue;
    for(const sp of r.specs)if(!isOnDuty(r,sp))standbyQueue.push({r:r,sp:sp});
  }
  const slots=loungeSlots();
  const chatCount=(S.feeds.reduce((n,e)=>n+(isLive(e)?(e.feed.chats||[]).length:0),0));
  let slotI=Math.min(chatCount,4); // chats occupy column-0 rows first
  const slotFor={};
  for(const q of standbyQueue){
    if(slotI>=slots.length)break;
    slotFor[q.r.ai+':'+q.sp.id]=slots[slotI++];
  }
  for(const r of S.rooms){
    if(r.dark||!isLive(r.feed))continue;
    const live=r.feed.feed.live||[];
    for(const sp of r.specs){
      const key=r.ai+':'+sp.id;seen.add(key);
      let e=S.crew.find(e=>e.key===key);
      const onDuty=isOnDuty(r,sp);
      const st=stationFor(r,sp.id);
      let dest,destMode;
      if(onDuty&&st){dest={x:st.x,y:st.y,room:r};destMode='work';}
      else{const s=slotFor[key]||{x:LOUNGE_X1-66,y:521};dest={x:s.x,y:s.y,room:null};destMode='rest';}
      const destKey=dest.x+','+dest.y+','+destMode;
      if(!e){
        /* brand-new crew member walks in from the corridor (no popping in) */
        e={key:key,ai:r.ai,color:r.color,spec:sp,name:sp.name||sp.id,role:sp.specialty||'?',
          x:clamp(dest.x,16,1000),y:CORR_Y,path:[],room:null,frame:0,ft:0,flip:1,
          speed:95+Math.random()*40,seed:Math.random()*6,mode:'walk',destMode:destMode,
          destKey:''};
        S.crew.push(e);
      }
      e.color=r.color;e.name=sp.name||sp.id;e.role=sp.specialty||'?';
      if(e.destKey!==destKey){
        e.destKey=destKey;e.destMode=destMode;e.destRoom=dest.room||null;
        e.returnTo=null;e.afterWalk=null; /* status change cancels any stroll */
        e.path=routePath(e,dest);
        if(!e.path.length){e.mode=destMode;e.room=dest.room||null;}
      }
      e.taskRef=null;
    }
    /* live task agents: walk in through the corridor, work, walk out */
    for(const a of live){
      if(!a||!a.id||a.id==='main-chat')continue; // Captain is persistent
      const key=r.ai+'|'+a.id;seen.add(key);
      let e=S.crew.find(e=>e.key===key);
      const st=stationFor(r,a.specialist);
      const dest=st?{x:st.x+18,y:st.y+6,room:r}:{x:r.x+r.w/2,y:412,room:r};
      if(!e){
        e={key:key,ai:r.ai,color:r.color,spec:null,agent:a,
          name:String(a.name||'agent').slice(0,26),role:a.project||'general',
          x:r.doorX,y:CORR_Y,path:[],room:null,frame:0,ft:0,flip:1,
          speed:100+Math.random()*40,seed:Math.random()*6,mode:'walk',
          destMode:'work',destKey:''};
        S.crew.push(e);
      }
      e.agent=a;e.color=r.color;
      const destKey='t'+dest.x+','+dest.y;
      if(e.destKey!==destKey){e.destKey=destKey;e.destMode='work';e.destRoom=dest.room||null;e.path=routePath(e,dest);}
    }
  }
  /* finished agents walk out through the nearest corridor end, then despawn */
  for(const e of S.crew){
    if(!seen.has(e.key)&&!e.removeWhenArrived&&e.mode!=='gone'){
      const endX=e.x<640?16:984;
      e.path=e.room?[{x:e.room.doorX,y:CORR_Y-48},{x:e.room.doorX,y:CORR_Y},{x:endX,y:CORR_Y}]
                   :[{x:endX,y:CORR_Y}];
      e.removeWhenArrived=true;e.destKey='out';e.destRoom=null;e.room=null;
    }
  }
}
function reconcileBots(){
  const bots=[];
  for(const r of S.rooms){
    if(!isLive(r.feed))continue;
    for(const j of (r.feed.feed.scheduled||[])){
      if(!j)continue;
      bots.push({job:j,ai:r.ai,color:r.color,dark:isStale(r.feed),
        status:isStale(r.feed)?'never':(j.last_status||'never'),x:0,y:0});
    }
  }
  const maxW=1264-16,bw=64,bh=58;let bx=16,by=648,row=0;
  const vis=[];
  for(const bt of bots){
    if(bx+bw>16+maxW){bx=16;row++;by+=bh;}
    if(row>1)break;
    bt.x=bx+bw/2;bt.y=by;bx+=bw;vis.push(bt);
  }
  S.bots=vis;S.botOverflow=bots.length-vis.length;
}
function reconcilePods(){
  const pods=[];
  const slots=loungeSlots();
  let i=0;
  for(const r of S.rooms){
    if(!isLive(r.feed))continue;
    for(const ch of (r.feed.feed.chats||[])){
      if(!ch||i>=4)break;
      const s=slots[i];
      pods.push({chat:ch,ai:r.ai,color:isStale(r.feed)?'#3a4358':r.color,
        x:s.x,y:s.y,dark:isStale(r.feed)});
      i++;

  }
  S.pods=pods;
}
/* ticker from real recent[] + failed jobs — honest text only */
function buildTicker(){
  const items=[];
  for(const e of S.feeds){
    if(!isLive(e))continue;
    const label=e.feed.label||e.meta.label||e.meta.ai||'?';
    for(const r of (e.feed.recent||[]).slice(0,15)){
      if(!r||!r.completed_at)continue;
      const t=Date.parse(r.completed_at);if(isNaN(t))continue;
      items.push({t:t,alert:r.status!=='done',
        txt:(r.status==='done'?'✓ ':r.status==='failed'?'✗ ':'■ ')+(r.name||'task')+' — '+label});
    }
    for(const j of (e.feed.scheduled||[])){
      if(j&&j.last_status==='error'&&!/\(disabled\)/i.test(j.name||'')){
        const t=Date.parse(j.last_run)||0;
        items.push({t:t,alert:true,txt:'⚠ JOB FAILED: '+(j.name||j.id)+' — '+label});
      }
    }
  }
  items.sort((a,b)=>b.t-a.t);
  S.redAlert=items.some(i=>i.alert);
  const anyOk=S.feeds.some(e=>isLive(e));
  const txt=items.length?items.slice(0,30).map(i=>i.txt).join('   ◆   ')
    :(anyOk?'FLEET QUIET — ALL SYSTEMS NOMINAL — FEEDS SYNC ~30 MIN':'AWAITING FLEET DATA — FEEDS SYNC ~30 MIN');
  if(txt!==S.tickerText){S.tickerText=txt;S.tickerX=1264;}
}

  ctx.textAlign='center';
  for(const e of S.crew){
    if(!e.agent&&e.mode!=='walk')continue;
    const moving=e.mode==='walk';
    const o={color:e.color,mode:moving?'walk':e.mode,frame:e.frame||0,t:S.t+e.seed,
      seed:e.seed,flip:e.flip||1,ai:e.ai,dim:false,
      name:e.agent?null:e.name};
    drawSprite(e.x,e.y,o);
    if(e.agent){
      /* live-task tag: real name + real elapsed from the feed */
      const a=e.agent;let el=a.elapsed_s||0;
      if(a.started_at){const p=(Date.now()-Date.parse(a.started_at))/1000;if(!isNaN(p)&&p>=0)el=p;}
      ctx.font='10px "Courier New",monospace';
      const tw=Math.max(ctx.measureText(e.name).width,ctx.measureText(fmtElapsed(el)).width)+12;
      ctx.fillStyle='rgba(5,9,18,0.85)';ctx.fillRect(e.x-tw/2,e.y-72,tw,30);
      ctx.strokeStyle=e.color;ctx.globalAlpha=0.5;
      ctx.strokeRect(e.x-tw/2+0.5,e.y-71.5,tw-1,29);ctx.globalAlpha=1;
      ctx.fillStyle='#e6f0ff';ctx.fillText(e.name,e.x,e.y-60);
      ctx.fillStyle=e.color;ctx.fillText(fmtElapsed(el),e.x,e.y-48);
      S.hits.push({x:e.x,y:e.y-14,r:20,type:'live',ref:{e:e}});
    }else{
      S.hits.push({x:e.x,y:e.y-16,r:18,type:'spec',ref:{e:e}});
    }
  }
  ctx.textAlign='left';
}
function drawLounge(){
  panel(LOUNGE_X0,164,LOUNGE_X1-LOUNGE_X0,426);
  ctx.fillStyle='#5ff2ff';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='left';
  ctx.fillText('LOUNGE — CREW AT REST',LOUNGE_X0+12,184);
  for(const p of S.pods){
    const ch=p.chat;
    ctx.fillStyle='#16223c';ctx.fillRect(p.x-34,p.y-32,68,40);
    ctx.fillStyle='#1f2c4e';ctx.fillRect(p.x-34,p.y-32,68,8);
    drawSprite(p.x,p.y+4,{color:p.color,mode:'rest',t:S.t,seed:p.x,dim:p.dark,noPlate:true,ai:p.ai});
    ctx.fillStyle=p.dark?'#3a4358':'#8b9bb8';ctx.font='9px "Courier New",monospace';ctx.textAlign='center';
    ctx.fillText(fitLabel(String(ch.name||'chat').slice(0,20),84),p.x,p.y-38);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-46,p.y-41,3,0,7);ctx.fill();
    S.hits.push({x:p.x,y:p.y-10,r:26,type:'chat',ref:{p:p}});
  }
  ctx.textAlign='left';
}
function drawDock(){
  ctx.fillStyle='rgba(6,10,20,0.93)';ctx.fillRect(0,600,LW,120);
  ctx.strokeStyle='rgba(95,242,255,0.18)';ctx.beginPath();ctx.moveTo(0,600.5);ctx.lineTo(LW,600.5);ctx.stroke();
  ctx.fillStyle='#5ff2ff';ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='left';
  ctx.fillText('SERVICE DOCK — SCHEDULED JOBS',24,618);
  ctx.fillStyle='#3a4358';ctx.font='9px "Courier New",monospace';ctx.textAlign='right';
  ctx.fillText('FLEET COMMAND v5 · TAKEOVER BUILD — SEBASTIAN',1256,618);
  ctx.textAlign='left';
  for(const bt of S.bots){
    drawBot(bt.x,bt.y,{color:bt.dark?'#3a4358':bt.color,status:bt.status,t:S.t});
    ctx.fillStyle=bt.dark?'#3a4358':'#8b9bb8';ctx.font='7px "Courier New",monospace';ctx.textAlign='center';
    ctx.fillText(fitLabel(bt.job.name||bt.job.id||'job',58),bt.x,bt.y+12);
    S.hits.push({x:bt.x,y:bt.y-13,r:20,type:'bot',ref:{bt:bt}});
  }
  if(S.botOverflow>0){
    ctx.fillStyle='#8b9bb8';ctx.font='10px "Courier New",monospace';ctx.textAlign='right';
    ctx.fillText('+'+S.botOverflow+' more',1150,690);
  }
  ctx.textAlign='left';
}
function drawOverlays(){
  if(S.feeds.length===0){
    ctx.textAlign='center';ctx.fillStyle='#5ff2ff';ctx.font='bold 26px "Courier New",monospace';
    ctx.fillText('AWAITING DATA',640,360);
    ctx.fillStyle='#8b9bb8';ctx.font='13px "Courier New",monospace';
    ctx.fillText(S.syncErr?'sync error: '+String(S.syncErr).slice(0,80):'connecting to data/registry.json…',640,388);
    ctx.textAlign='left';return;
  }
  if(!S.feeds.some(e=>isLive(e))){
    ctx.textAlign='center';ctx.fillStyle='#ff5470';ctx.font='bold 22px "Courier New",monospace';
    ctx.fillText('ALL FEEDS OFFLINE',640,360);ctx.textAlign='left';
  }
}

/* ═══════════════ detail card (tap a crew member) ═══════════════ */
function cardPos(lx,ly){
  const sx=OX+lx*SC,sy=OY+ly*SC,card=$('card');
  card.classList.add('show');
  const w=Math.min(320,VW*0.86),h=card.offsetHeight||160;
  card.style.left=clamp(sx+14,8,VW-w-8)+'px';
  card.style.top=clamp(sy-h-10,8,VH-h-8)+'px';
}
function showCard(kind,title,rows,lx,ly){
  $('card-k').textContent=kind;$('card-t').textContent=title;
  $('card-b').innerHTML=rows.map(r=>'<div class="row"><b>'+esc(r[0])+':</b> '+esc(r[1])+'</div>').join('')
    +(rows.task?'<div class="task">'+esc(rows.task)+'</div>':'');
  cardPos(lx,ly);
}
function hideCard(){$('card').classList.remove('show');}
$('card-x').addEventListener('click',ev=>{ev.stopPropagation();hideCard();});
function onTap(lx,ly){
  for(let i=S.hits.length-1;i>=0;i--){
    const h=S.hits[i],dx=lx-h.x,dy=ly-h.y;
    if(dx*dx+dy*dy<=h.r*h.r){
      sfxClick();
      const r=h.ref;
      if(h.type==='live'){const a=r.e.agent||{};
        let el=a.elapsed_s||0;
        if(a.started_at){const p=(Date.now()-Date.parse(a.started_at))/1000;if(!isNaN(p)&&p>=0)el=p;}
        const rows=[['AI',r.e.ai],['Project',a.project||'?'],['Specialist',a.specialist||'?'],
          ['Elapsed',fmtElapsed(el)],['Status','running']];rows.task=a.task||'';
        showCard('LIVE AGENT',a.name||'agent',rows,lx,ly);return;
      }
      if(h.type==='spec'){const e=r.e,sp=e.spec||{};
        const room=S.rooms.find(rm=>rm.ai===e.ai);
        const rows=[['AI',e.ai],['Role',(e.name||'?')+' · '+(e.role||'?')]];
        const st=e.mode==='work'?'on duty':e.mode==='walk'?'walking':(e.mode==='rest'?'standby':e.mode);
        rows.push(['Status',room&&room.dark?'NO SIGNAL':st]);
        if(sp.specialty)rows.push(['Specialty',sp.specialty]);
        if(e.agent&&e.agent.task)rows.task=e.agent.task;
        showCard('SPECIALIST',e.name||'crew',rows,lx,ly);return;
      }
      if(h.type==='cryo'){
        const feed=r.r.feed;
        const rows=[['AI',r.r.label],['Status','NO SIGNAL'],
          ['Feed',!isLive(feed)?(!feed.ok?'fetch failed':'placeholder — awaiting first report'):'stale > 45 min']];
        showCard('CRYO POD',r.r.label+' — untapped',rows,lx,ly);return;
      }
      if(h.type==='bot'){const j=r.bt.job;
        const rows=[['AI',r.bt.ai],['Schedule',j.schedule||'?'],
          ['Last run',(j.last_run?ago(j.last_run):'never')+' · '+(j.last_status||'never')],
          ['Next run',j.next_run?ago(j.next_run).replace(' ago','')+' left':'?']];
        showCard('SCHEDULED JOB',j.name||j.id||'job',rows,lx,ly);return;
      }
      if(h.type==='chat'){const ch=r.p.chat;
        const rows=[['AI',r.p.ai],['Status','docked'],
          ['Last active',ch.last_active?ago(ch.last_active):'?']];
        showCard('DOCKED CHAT',ch.name||'chat',rows,lx,ly);return;
      }
    }
  }
  hideCard();
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  onTap((e.clientX-r.left-OX)/SC,(e.clientY-r.top-OY)/SC);
});

/* ═══════════════ main loop ═══════════════ */
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  const dt=clamp((now-lastT)/1000,0,0.1)||0.016;lastT=now;S.t+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#04060d';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  S.hits.length=0;
  stepCrew(dt);
  drawStars(dt);
  drawWall(dt);
  drawDeck();
  drawRooms(dt);
  drawCorridor(dt);
  drawCrewLayer();
  drawLounge();
  drawDock();
  drawOverlays();
}
/* ═══════════════ boot ═══════════════ */
resize();
sync();
setInterval(sync,POLL_MS);
requestAnimationFrame(frame);
</script>
